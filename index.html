/* ---------- CHANNELS actions ---------- */
async function cmWriteAri(prop,gids,dates,fn){
  const byDoc={};
  for(const gid of gids) for(const d of dates){ const id=ariId(prop,gid,d); (byDoc[id]=byDoc[id]||{gid,month:d.slice(0,7),days:[]}).days.push(d.slice(8)); }
  await guard(async()=>{
    for(const [id,x] of Object.entries(byDoc)){
      const cur=CM.ari[id]||{prop,gid:x.gid,month:x.month,days:{}}; const days=Object.assign({},cur.days||{});
      for(const dd of x.days){ const v=fn(Object.assign({},days[dd]||{})); if(v.rate==null&&!v.stop&&!(+v.minStay>1)) delete days[dd]; else days[dd]=v; }
      await S.db.doc("ari/"+id).set({prop,gid:x.gid,month:x.month,days,updatedAt:nowIso(),by:S.uid||null});
    }
  },"Saved — booking sites update shortly");
}
async function cmEditCell(gid,date){
  const prop=S.prop, g=cmGroups(prop).find(x=>x.gid===gid); if(!g) return;
  const a=ariGet(prop,gid,date);
  const ok=await ask(`<h3 style="margin-bottom:8px">${esc(g.label)} · ${esc(fdw(date))} ${date.slice(0,4)}</h3>
    <div class="grid-form"><label class="field"><span>Price ฿ (Setup price ${money(g.rate)})</span><input type="number" id="ce-price" min="0" step="0.01" value="${a.rate!=null?a.rate:""}" placeholder="${g.rate}"></label>
    <label class="field"><span>Min stay</span><input type="number" id="ce-min" min="1" step="1" value="${+a.minStay>1?a.minStay:""}" placeholder="1"></label></div>
    <label class="cm-chk" style="margin-top:10px"><input type="checkbox" id="ce-stop" ${a.stop?"checked":""}> Stop selling this day on all booking sites</label>
    <p class="muted" style="margin:8px 0 0;font-size:.8rem">Leave price empty to use the Setup price.</p>`,"Save");
  if(!ok) return;
  const p=$("#ce-price").value.trim(), m=parseInt($("#ce-min").value)||1, stop=$("#ce-stop").checked;
  await cmWriteAri(prop,[gid],[date],()=>({rate:p&&+p>0?r2(p):null,stop,minStay:m}));
}
async function cmBulk(){
  const prop=S.prop, gids=[...document.querySelectorAll(".cm-bg:checked")].map(e=>e.value), wds=[...document.querySelectorAll(".cm-wd:checked")].map(e=>+e.value);
  const from=$("#cm-from").value, to=$("#cm-to").value, price=$("#cm-price").value.trim(), stop=$("#cm-stop").value, min=$("#cm-min").value.trim();
  CM.bulk={groups:gids,from,to,price,stop,min,days:wds};
  if(!gids.length){ toast("Tick at least one room type."); return; }
  if(!validDate(from)||!validDate(to)||to<from){ toast("Check the dates: To must be on or after From."); return; }
  if(from<S.today){ toast("Past dates can't be sent to booking sites. Start from today."); return; }
  if(!price&&stop==="keep"&&!min){ toast("Enter a price, stop-sell or min stay to change."); return; }
  const dates=[]; for(let d=from; d<=to; d=addDays(d,1)) if(wds.includes(dow(d))) dates.push(d);
  if(!dates.length){ toast("No days match the weekdays you ticked."); return; }
  if(dates.length*gids.length>1500){ toast("That's a lot of days. Change at most about a year at a time."); return; }
  if(!await ask(`<p>Update <b>${dates.length}</b> day${dates.length===1?"":"s"} for <b>${gids.length}</b> room type${gids.length===1?"":"s"}?</p><p class="muted">${price?(+price>0?`Price ${money(price)}. `:"Price back to Setup. "):""}${stop!=="keep"?(stop==="close"?"Stop selling. ":"Open for sale. "):""}${min?`Min stay ${min} night${+min===1?"":"s"}.`:""}</p>`,"Apply")) return;
  await cmWriteAri(prop,gids,dates,v=>{ if(price) v.rate=+price>0?r2(price):null; if(stop!=="keep") v.stop=stop==="close"; if(min) v.minStay=Math.max(1,parseInt(min)||1); return v; });
}
async function cmSaveMarkups(){
  const channels=JSON.parse(JSON.stringify(S.settings.channels));
  for(const ch of CM_OTA){ const v=$("#mk-"+ch); if(v&&channels[ch]) channels[ch].markup=Math.max(0,Math.min(200,+v.value||0)); }
  await guard(()=>S.db.doc("settings/main").update({channels}),"Markups saved");
}
async function cmSaveMap(){
  const prop=S.prop, groups=cmGroups(prop), cfg={prop,property_id:($("#map-prop").value||"").trim(),enabled:$("#map-enabled").checked,groups:{},updatedAt:nowIso()};
  for(const g of groups){ const rt=($("#map-rt-"+g.gid).value||"").trim(); if(!rt) continue; const plans={};
    for(const ch of CM_OTA){ const v=($(`#map-rp-${g.gid}-${ch}`).value||"").trim(); if(v) plans[ch]=v; } cfg.groups[g.gid]={room_type_id:rt,plans}; }
  if(cfg.enabled&&!cfg.property_id){ toast("Choose the Channex property before turning sync on."); return; }
  if(CM.setup){ const rpById={}; for(const p of CM.setup.rate_plans||[]) rpById[p.id]=p;
    const usedRt={}, usedRp={};
    for(const g of groups){ const m=cfg.groups[g.gid]; if(!m) continue;
      if(usedRt[m.room_type_id]){ toast(`${g.label} and ${usedRt[m.room_type_id]} are linked to the same Channex room type. Each needs its own.`); return; }
      usedRt[m.room_type_id]=g.label;
      for(const [ch,id] of Object.entries(m.plans)){ const rp=rpById[id];
        if(rp&&rp.room_type_id!==m.room_type_id){ toast(`${g.label}: the ${chanLabel(ch)} plan belongs to a different room type. Pick this room's own plan.`); return; }
        if(usedRp[id]){ toast(`The same rate plan is used twice (${usedRp[id]} and ${g.label} · ${chanLabel(ch)}). Each room and site needs its own plan.`); return; }
        usedRp[id]=`${g.label} · ${chanLabel(ch)}`; } } }
  const ok=await guard(()=>S.db.doc("cmconfig/"+prop).set(cfg),"Mapping saved");
  if(ok) CM.mapDraft={};
  if(ok&&cfg.enabled) setTimeout(()=>cmSync(prop,true),1500);
}
async function cmLoadSetup(){
  try{ CM.setup=await cmCall("get_setup"); toast("Loaded from Channex"); }catch(e){ toast(cmErrText(e)); }
  render();
}

function cmCaptureDraft(t){
  if(t.closest&&t.closest("#cm-map")&&t.id){ CM.mapDraft=CM.mapDraft||{}; CM.mapDraft[t.id]=t.type==="checkbox"?t.checked:t.value; }

  }
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{ if(S.tPick&&!e.target.closest(".mpick")&&!e.target.closest('[data-act="t-cal"]')){ S.tPick=false; render(); } },true);
document.addEventListener("click",async e=>{
  const go=e.target.closest("[data-view-go]"); if(go){ S.view=go.dataset.viewGo; render(); return; }
  const tab=e.target.closest(".tab[data-view]"); if(tab){ S._force=true; S.view=tab.dataset.view; if(S.view==="reports") S.repData=null; render(); window.scrollTo(0,0); return; }
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act, id=el.dataset.id;
  switch(a){
    case "new": newBooking(); break;
    case "new-at": newBooking({unit:el.dataset.unit,date:el.dataset.date}); break;
    case "open": openBooking(id); break;
    case "close": closeDlg(); break;
    case "save": e.preventDefault(); saveBooking(); break;
    case "checkin": case "checkout": case "noshow": case "cancel": case "reopen": case "delete": case "void": doStatus(id,a); break;
    case "add-charge": addCharge($("#c-desc").value,$("#c-amt").value); break;
    case "preset": { const x=S.settings.extras[+el.dataset.i]; if(!x) break; if(x.amount){ addCharge(x.label,x.amount); } else { $("#c-desc").value=x.label; $("#c-amt").focus(); } break; }
    case "del-charge": case "del-pay": { const b=S.bookings.find(x=>x.id===S.open?.id); if(!b) break;
      if(a==="del-charge"){ const c=(b.charges||[]).find(c=>c.id===el.dataset.cid); if(c&&await ask(`<p>Remove charge <b>${esc(c.desc)}</b> ${money(c.amount)}?</p>`,"Remove",true)) patchBooking(b,{charges:b.charges.filter(x=>x.id!==c.id)},`Charge removed: ${c.desc} ${money(c.amount)}`,"Charge removed"); }
      else { const p=(b.payments||[]).find(p=>p.id===el.dataset.pid); if(p&&await ask(`<p>Remove payment ${money(p.amount)} by ${esc(p.method)}? Use this only to correct a mistake.</p>`,"Remove",true)) patchBooking(b,{payments:b.payments.filter(x=>x.id!==p.id)},`Payment removed: ${money(p.amount)} ${p.method}`,"Payment removed"); }
      break; }
    case "add-pay": addPayment(); break;
    case "cm-tab": CM.tab=el.dataset.k; S._force=true; render(); break;
    case "cm-move": CM.calStart=addDays(CM.calStart||S.today,+el.dataset.n); if(CM.calStart<S.today) CM.calStart=S.today; S._force=true; render(); break;
    case "cm-today": CM.calStart=S.today; S._force=true; render(); break;
    case "cm-edit": cmEditCell(el.dataset.g,el.dataset.d); break;
    case "cm-bulk": cmBulk(); break;
    case "cm-markups": cmSaveMarkups(); break;
    case "cm-savemap": cmSaveMap(); break;
    case "cm-loadsetup": cmLoadSetup(); break;
    case "cm-check": cmCheck(); break;
    case "cm-import": cmImport(true); break;
    case "cm-sync": (async()=>{ const n=await cmSync(S.prop,true); toast(n?`Sent ${n} updates to the booking sites`:"Booking sites are up to date"); })(); break;
    case "dpick": { const n=document.getElementById(el.dataset.for); if(n){ try{ n.showPicker(); }catch(_){ n.style.pointerEvents="auto"; n.focus(); n.click(); n.style.pointerEvents=""; } } break; }
    case "img-del": delImage(+el.dataset.i); break;
    case "pp-view": viewPassport(el.dataset.id); break;
    case "uncollect": uncollectPayment(el.dataset.id,el.dataset.pid); break;
    case "t-move": { const m=S.tMode||"day", a=S.tAnchor||S.today, k=+el.dataset.k; S.tAnchor=m==="month"?ymAdd(a.slice(0,7),k)+"-01":addDays(a,m==="week"?7*k:k); render(); window.scrollTo(0,0); break; }
    case "t-now": S.tAnchor=S.today; S.tPick=false; render(); break;
    case "goto-cal": S.view="calendar"; render(); window.scrollTo(0,0); break;
    case "cal-day": { const d=el.dataset.d; S.calOpen=S.calOpen||new Set(); S.calOpen.has(d)?S.calOpen.delete(d):S.calOpen.add(d); render(); break; }
    case "day-toggle": { const d=el.dataset.d; S.dayOpen.has(d)?S.dayOpen.delete(d):S.dayOpen.add(d); render(); break; }
    case "day-all": { const ds=(el.dataset.days||"").split(",").filter(Boolean); const any=ds.some(d=>S.dayOpen.has(d)); ds.forEach(d=>any?S.dayOpen.delete(d):S.dayOpen.add(d)); render(); break; }
    case "t-cal": { if((S.tMode||"day")==="month"){ S.tPick=!S.tPick; S.tPickYear=+(S.tAnchor||S.today).slice(0,4); render(); } else { const n=$("#t-date"); if(n){ try{ n.showPicker(); }catch(_){ n.style.pointerEvents="auto"; n.focus(); n.click(); n.style.pointerEvents=""; } } } break; }
    case "mp-year": S.tPickYear=(S.tPickYear||+S.today.slice(0,4))+(+el.dataset.k); render(); break;
    case "mp-pick": S.tAnchor=el.dataset.ym+"-01"; S.tPick=false; render(); window.scrollTo(0,0); break;
    case "pp-set": { const o=S.open, b=o&&S.bookings.find(x=>x.id===o.id); if(b){ await guard(()=>bRef(b.id).update({ppImg:el.dataset.id}),"Passport photo set"); b.ppImg=el.dataset.id; renderThumbs(); syncThumb(b.id,o.imgs||[]); } break; }
    case "lb-open": { const m=imgList()[+el.dataset.i]; if(m){ $("#lb-img").src=m.dataUrl; $("#lb-cap").textContent=m.name||""; $("#lb").showModal(); } break; }
    case "lb-close": $("#lb").close(); break;
    case "add-discount": addDiscount(); break;
    case "disc-reason": { const i=el.closest(".disc-body")?$("#d-reason"):$("#f-discReason"); if(i){ i.value=el.dataset.r; i.dispatchEvent(new Event("input",{bubbles:true})); } break; }
    case "goto-pending": S.view="bookings"; S.fstatus="pending"; render(); break;
    case "collect": e.stopPropagation(); collectPayment(id,el.dataset.pid); break;
    case "invoice": { const b=S.bookings.find(x=>x.id===S.open?.id); if(b) save(`invoice-${b.ref||b.id.slice(-6)}.html`,invoiceHtml(b)); break; }
    case "cal-move": S.calStart=addDays(S.calStart,+el.dataset.n); render(); break;
    case "cal-today": S.calStart=addDays(S.today,-1); render(); break;
    case "rep-preset": { const p=el.dataset.p; S.rep=p==="this"?monthRange(0):p==="last"?monthRange(-1):p==="7"?{from:addDays(S.today,-7),to:addDays(S.today,-1)}:{from:S.today.slice(0,4)+"-01-01",to:S.today}; S.repData=null; render(); break; }
    case "rep-pay-csv": if(S.repData&&S.rep){ const R=computeReport(S.repData.filter(b=>b.checkIn<=S.rep.to&&inProp(b)),S.rep.from,S.rep.to); save(`holy-hostel-payments-${S.rep.from}_to_${S.rep.to}.csv`,paymentsCsv(R)); } break;
    case "rep-pdf": reportPdf(); break;
    case "rep-xlsx": reportXlsx(); break;
    case "rep-tab": S.repTab=el.dataset.k; render(); break;
    case "month-close": { const ym=S.rep.from.slice(0,7), close=el.dataset.v==="1", ps=repProps();
      if(await ask(close?`<p>Close <b>${esc(monthName(ym))}</b> for ${esc(ps.length>1?"all locations":propInfo().name)}?</p><p class="muted">Staff won't be able to change bookings, charges or payments in this month. You can still make changes and reopen it any time.</p>`:`<p>Reopen <b>${esc(monthName(ym))}</b>? Staff will be able to change it again.</p>`,close?"Close month":"Reopen")) await setMonthClosed(ps,ym,close); break; }
    case "hg-import": hgOpen(); break;
    case "exp-month": S.expMonth=ymAdd(S.expMonth||S.today.slice(0,7),+el.dataset.k); render(); break;
    case "exp-fixed": expEdit(null,"fixed"); break;
    case "exp-once": expEdit(null,"once"); break;
    case "exp-edit": expEdit(el.dataset.id); break;
    case "hg-close": if(!HG.busy) closeDlg(); break;
    case "hg-again": HG.plan=null; hgRender(); break;
    case "hg-go": hgImport(); break;
    case "payout": editPayout(el.dataset.prop,el.dataset.ym,el.dataset.ch); break;
    case "rep-csv": if(S.repData) save(`holy-hostel-${S.rep.from}_to_${S.rep.to}.csv`,reportCsv()); break;
    case "unit-save": unitSave(id); break;
    case "unit-add": unitAdd(); break;
    case "unit-del": unitDel(id); break;
    case "settings-save": settingsSave(); break;
  }
});
document.addEventListener("focusout",()=>{ setTimeout(()=>{ if(S._pending){ const ae=document.activeElement; if(!ae||!$("#main").contains(ae)||!/^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)) render(); } },200); });
document.addEventListener("focusout",e=>{ const t=e.target; if(t.classList&&t.classList.contains("dtxt")){ setTimeout(()=>{ const n=document.getElementById(t.dataset.dfor); if(n&&document.activeElement!==t){ if(t.value&&!parseDmy(t.value)) toast("Type the date as dd/mm/yyyy, e.g. "+dmy(n.value||S.today)); t.value=dmy(n.value); t.classList.remove("bad"); } },0); } });
document.addEventListener("toggle",e=>{ const d=e.target; if(d&&d.dataset&&d.dataset.acc){ if(d.open) S.accOpen.add(d.dataset.acc); else S.accOpen.delete(d.dataset.acc); } },true);
addEventListener("resize",()=>{ clearTimeout(S._rz); S._rz=setTimeout(()=>{ if(S.view==="calendar"&&!document.querySelector("dialog[open]")) render(); },250); });
document.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.target.closest("button,input,select,textarea,a")){ const tr=e.target.closest("tr[data-act='open'],.bk-card"); if(tr) openBooking(tr.dataset.id); } });
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="act-q"){ S.actQ=t.value; const bd=$("#act-body"); if(bd) bd.innerHTML=actRowsHtml(activityFor(repProps(),S.rep.from,S.rep.to)); return; }
  cmCaptureDraft(t);
  if(t.classList&&t.classList.contains("dtxt")){
    let v=t.value.replace(/[^\d\/]/g,"");
    v=v.replace(/^(\d{2})(\d)/,"$1/$2").replace(/^(\d{1,2}\/\d{2})(\d)/,"$1/$2").slice(0,10);
    if(v!==t.value) t.value=v;
    const iso=parseDmy(v); t.classList.toggle("bad",v.length>=8&&!iso);
    if(iso){ const n=document.getElementById(t.dataset.dfor); if(n&&n.value!==iso){ n.value=iso; n.dispatchEvent(new Event("input",{bubbles:true})); n.dispatchEvent(new Event("change",{bubbles:true})); } }
    return;
  }
  if(t.id==="q"){ S.q=t.value; clearTimeout(S._qt); S._qt=setTimeout(render,150); }
  if(t.id==="f-payAmt") t.dataset.touched="1";
  if(t.id==="d-val"||t.name==="d-type") discPreview();
  if(t.closest&&t.closest("#bform")) formHints();
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.classList&&t.classList.contains("dnative")) setTimeout(syncDates,0);
  cmCaptureDraft(t);
  if(t.id==="map-prop"||(t.id&&t.id.startsWith("map-rt-"))){ S._force=true; render(); return; }
  if(t.id==="cm-days"){ CM.calDays=+t.value; S._force=true; render(); return; }
  if(t.id==="cm-showch"){ CM.showCh=t.checked; S._force=true; render(); return; }
  if(t.id==="prop-sel"){ CM.mapDraft={}; CM.setup=CM.setup; S._force=true; S.prop=t.value; try{localStorage.setItem("hh-prop",S.prop);}catch(_){} S.repData=null; render(); return; }
  if(t.id==="act-type"){ S.actType=t.value; const bd=$("#act-body"); if(bd) bd.innerHTML=actRowsHtml(activityFor(repProps(),S.rep.from,S.rep.to)); return; }
  if(t.id==="hg-file"){ hgFile(t.files&&t.files[0]); t.value=""; return; }
  if(t.classList&&t.classList.contains("hg-map")){ const m=hgRoomMap(); if(t.value) m[t.dataset.room]=t.value; else delete m[t.dataset.room]; try{ localStorage.setItem("hh-roommap",JSON.stringify(m)); }catch(_){} if(HG.parsed){ S.accOpen.add("hgmap"); HG.plan=hgPlan(HG.parsed); hgRender(); } return; }
  if(t.id==="hg-cancel"){ HG.cancelMissing=t.checked; hgRender(); return; }
  if(t.name==="t-mode"){ S.tMode=t.value; S.tAnchor=S.today; S.tPick=false; render(); return; }
  if(t.id==="t-date"&&validDate(t.value)){ S.tAnchor=t.value; render(); return; }
  if(t.name==="rep-scope"){ S.repScope=t.value; try{localStorage.setItem("hh-repscope",t.value);}catch(_){} render(); return; }
  if(t.id==="fstatus"){ S.fstatus=t.value; render(); }
  if(t.id==="cal-days"){ S.calDays=+t.value; render(); }
  if(t.id==="cal-jump"&&validDate(t.value)){ S.calStart=t.value; render(); }
  if((t.id==="rep-from"||t.id==="rep-to")&&validDate(t.value)){ S.rep=Object.assign({},S.rep,{[t.id==="rep-from"?"from":"to"]:t.value}); S.repData=null; render(); }
  if(t.id==="f-unitId"||t.id==="f-guests"){ const u=unitById($("#f-unitId").value); if(u){ $("#f-rate").value=unitRate(u,Math.max(1,parseInt($("#f-guests").value)||1)); $("#f-rate").dataset.full=""; } formHints(); }
  if(t.id==="f-checkIn"){ const ci=t.value, co=$("#f-checkOut"); if(validDate(ci)&&(!validDate(co.value)||co.value<=ci)) co.value=addDays(ci,1); formHints(); }
});
$("#dlg").addEventListener("close",()=>{ if(S.open&&S.open.unsubImg) S.open.unsubImg(); S.open=null; });
document.addEventListener("change",e=>{ if(e.target.id==="img-input"){ addImages(e.target.files); e.target.value=""; } });
["dragenter","dragover"].forEach(ev=>document.addEventListener(ev,e=>{ const z=e.target.closest&&e.target.closest("#dropzone"); if(z){ e.preventDefault(); z.classList.add("over"); } }));
["dragleave","drop"].forEach(ev=>document.addEventListener(ev,e=>{ const z=e.target.closest&&e.target.closest("#dropzone"); if(z){ e.preventDefault(); z.classList.remove("over"); if(ev==="drop"&&e.dataTransfer) addImages(e.dataTransfer.files); } }));
document.addEventListener("paste",e=>{ if(!S.open||!$("#dlg").open) return; const fs=[...(e.clipboardData?.files||[])].filter(f=>/^image\//.test(f.type)); if(fs.length){ e.preventDefault(); addImages(fs); } });
document.addEventListener("keydown",e=>{ if((e.key==="Enter"||e.key===" ")&&e.target.id==="dropzone"){ e.preventDefault(); $("#img-input").click(); } });
setInterval(()=>{ const t=todayBkk(); if(t!==S.today){ S.today=t; render(); } },60000);

boot();
})();
</script>
