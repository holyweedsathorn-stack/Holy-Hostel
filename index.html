<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0E6A59">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Holy PMS">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Holy Hostel PMS</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>[hidden]{display:none!important} html,body{margin:0}</style>
<style>
/* Layout: sticky top bar with view tabs; one working surface below. Front-desk tool, scanned not read. */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --surface-2:#F7F9F8; --ink:#14201C; --muted:#5C6A65; --line:#DAE1DE; --line-2:#E8EDEB;
  --accent:#0E6A59; --accent-ink:#FFFFFF; --accent-soft:#DCEEE8;
  --brass:#A8731A; --brass-soft:#F5E9D3;
  --ok:#1D7A4C; --ok-soft:#DDF1E5; --warn:#9A5B00; --warn-soft:#FBEBD0; --bad:#B3261E; --bad-soft:#F9DEDC; --info:#2C56AE; --info-soft:#DFE7F8;
  --weekend:#EEF2F0; --today:#E4F2EC;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans","IBM Plex Sans Thai",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#161F1C; --surface-2:#1B2522; --ink:#E3EBE8; --muted:#93A39D; --line:#2B3632; --line-2:#222C29;
  --accent:#43B497; --accent-ink:#04211A; --accent-soft:#17392F;
  --brass:#D9A54A; --brass-soft:#3A2E17;
  --ok:#52C48C; --ok-soft:#173527; --warn:#E3A23E; --warn-soft:#3A2B12; --bad:#F2766B; --bad-soft:#3E1E1B; --info:#86A6F2; --info-soft:#1C2A47;
  --weekend:#131B18; --today:#16302A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161F1C; --surface-2:#1B2522; --ink:#E3EBE8; --muted:#93A39D; --line:#2B3632; --line-2:#222C29;
  --accent:#43B497; --accent-ink:#04211A; --accent-soft:#17392F;
  --brass:#D9A54A; --brass-soft:#3A2E17;
  --ok:#52C48C; --ok-soft:#173527; --warn:#E3A23E; --warn-soft:#3A2B12; --bad:#F2766B; --bad-soft:#3E1E1B; --info:#86A6F2; --info-soft:#1C2A47;
  --weekend:#131B18; --today:#16302A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.25rem} h3{font-size:1rem}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:16px;padding:10px 16px;max-width:1400px;margin:0 auto;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand h1{font-size:1.2rem}
.brand .mark{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:6px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:700;font-size:.95rem;align-self:center}
.tabs{display:flex;gap:2px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.tab{border:0;background:none;padding:8px 12px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.clock{font-size:.8rem;color:var(--muted)}
.brand{flex-wrap:wrap}
select.prop-sel{width:auto;align-self:center;font-weight:600;padding:4px 8px;background:var(--accent-soft);color:var(--accent);border-color:transparent}

main{max-width:1400px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:flex;flex-direction:column;gap:20px}
.bar-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar-row .grow{margin-right:auto}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:6px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.small{padding:4px 9px;font-size:.82rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:none}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],input[type=search],select,textarea{
  border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 9px;min-width:0;width:100%}
textarea{resize:vertical;min-height:60px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:.78rem;color:var(--muted);font-weight:500}
.grid-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.span2{grid-column:span 2} @media (max-width:520px){.span2{grid-column:auto}}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.panel-h h3{margin-right:auto}
.panel-b{padding:12px 16px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px;align-items:start}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:var(--f-display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .s{font-size:.8rem;color:var(--muted)}

/* lists */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--line-2);flex-wrap:wrap}
.row:first-child{border-top:0}
.row .who{display:flex;flex-direction:column;min-width:0;flex:1 1 180px;cursor:pointer}
.row .who b{font-weight:600}
.row .who small{color:var(--muted)}
.empty{padding:18px 16px;color:var(--muted)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-confirmed{background:var(--info-soft);color:var(--info)}
.st-checked_in{background:var(--ok-soft);color:var(--ok)}
.st-checked_out{background:var(--line-2);color:var(--muted)}
tr.void-row td{color:var(--bad)!important;text-decoration:line-through;text-decoration-color:var(--bad)}
tr.void-row td .pill,tr.void-row td .btn{text-decoration:none}
.void-title{color:var(--bad);text-decoration:line-through}
.void-banner{background:var(--bad-soft);color:var(--bad);border-radius:6px;padding:8px 12px;font-size:.88rem}
.st-void{background:var(--line-2);color:var(--bad);text-decoration:line-through}
tr.voided td{color:var(--muted);text-decoration:line-through}
.st-cancelled,.st-no_show{background:var(--bad-soft);color:var(--bad)}
.due{color:var(--bad);font-weight:600}
.paid{color:var(--ok)}
.chan{font-family:var(--f-mono);font-size:.72rem;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}

/* tables */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 12px;border-top:1px solid var(--line-2);white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;border-top:0;background:var(--surface-2)}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
tfoot td{font-weight:600;border-top:1px solid var(--line)}

/* tape chart */
.tape-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.tape{--lw:170px;min-width:calc(var(--lw) + var(--days) * var(--dw));font-size:.82rem}
.t-row{display:flex;border-top:1px solid var(--line-2);min-height:38px}
.t-head{position:sticky;top:0;z-index:3;background:var(--surface);border-top:0}
.t-lab{position:sticky;left:0;z-index:2;flex:0 0 var(--lw);width:var(--lw);background:var(--surface);border-right:1px solid var(--line);padding:6px 10px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.t-lab b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-lab small{color:var(--muted);font-size:.72rem}
.t-track{position:relative;display:grid;grid-template-columns:repeat(var(--days),var(--dw));flex:0 0 auto}
.t-day{border-left:1px solid var(--line-2);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 0;line-height:1.1}
.t-day .dn{font-family:var(--f-mono);font-weight:500;font-size:.85rem}
.t-day .dw{font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.t-cell{border:0;border-left:1px solid var(--line-2);background:none;padding:0;cursor:pointer}
.t-cell:hover{background:var(--accent-soft)}
.wk{background:var(--weekend)} .td{background:var(--today)}
.t-group{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--surface-2);border-top:1px solid var(--line);font-weight:600;font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);position:sticky;left:0}
.t-group .occ{font-family:var(--f-mono);text-transform:none;letter-spacing:0;font-weight:400}
.tb{position:absolute;top:4px;bottom:4px;left:calc(var(--s) * var(--dw) + 2px);width:calc(var(--l) * var(--dw) - 4px);border-radius:5px;border:0;padding:0 6px;display:flex;align-items:center;gap:5px;overflow:hidden;cursor:pointer;text-align:left;font-size:.78rem;font-weight:500;white-space:nowrap;border-left:3px solid}
.tb.st-confirmed{background:var(--info-soft);color:var(--ink);border-color:var(--info)}
.tb.st-checked_in{background:var(--ok-soft);color:var(--ink);border-color:var(--ok)}
.tb.st-checked_out{background:var(--line-2);color:var(--muted);border-color:var(--muted)}
.tb.clipL{border-top-left-radius:0;border-bottom-left-radius:0}
.tb .dot{width:7px;height:7px;border-radius:50%;background:var(--bad);flex:0 0 auto}
.tb span{overflow:hidden;text-overflow:ellipsis}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px;border-left:3px solid}
.type-tag{display:inline-block;font-size:.66rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:4px}
.type-rooftop{background:var(--brass-soft);color:var(--brass)}
.type-private{background:var(--accent-soft);color:var(--accent)}
.type-dorm{background:var(--info-soft);color:var(--info)}

/* dialog */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);border-radius:12px;width:min(920px,calc(100vw - 24px));max-height:calc(100dvh - 24px);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(8,16,13,.45)}
.dlg{display:flex;flex-direction:column;max-height:calc(100dvh - 24px)}
.dlg-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dlg-h h2{margin-right:auto;font-size:1.2rem}
.dlg-b{overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:18px}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
@media (max-width:600px){dialog#dlg{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;border-radius:0;margin:0}#dlg .dlg{max-height:100dvh;height:100%}#dlg .dlg-b{flex:1;padding:14px 14px}#dlg .dlg-h{padding:max(12px,env(safe-area-inset-top)) 14px 12px}#dlg .dlg-f{padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}#dlg .dlg-f .btn{flex:1;justify-content:center}}
.section-t{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.section-t h3{margin-right:auto}
.folio td{white-space:normal}
.totals{display:grid;grid-template-columns:auto auto;justify-content:end;gap:4px 24px;padding:10px 12px;font-variant-numeric:tabular-nums}
.totals .big{font-family:var(--f-display);font-size:1.25rem;font-weight:700}
.inline-add{display:grid;grid-template-columns:minmax(0,2fr) minmax(90px,1fr) auto;gap:8px;align-items:end}
@media (max-width:520px){.inline-add{grid-template-columns:1fr 1fr}.inline-add .btn{grid-column:span 2}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px dashed var(--line);background:none;border-radius:999px;padding:3px 10px;font-size:.78rem;cursor:pointer;color:var(--muted)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.hist{font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:8px 12px;font-size:.85rem}
.errbox{background:var(--bad-soft);color:var(--bad);border-radius:6px;padding:8px 12px;font-size:.85rem}
.notice{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:var(--r);padding:12px 16px}

/* charts */
.hbar{display:grid;grid-template-columns:minmax(90px,140px) minmax(0,1fr) auto;gap:6px 10px;align-items:center;font-size:.85rem}
.hbar .track{height:14px;background:var(--line-2);border-radius:3px;overflow:hidden}
.hbar .fill{height:100%;background:var(--accent);border-radius:3px}
svg text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}

.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--line);border-radius:6px;font-weight:500;background:var(--surface)}
.seg span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--pm,var(--muted))}
.seg input:checked+span{border-color:var(--pm,var(--accent));background:color-mix(in srgb,var(--pm,var(--accent)) 12%,var(--surface));font-weight:600}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.pm-cash{--pm:var(--ok)} .pm-card{--pm:var(--info)} .pm-promptpay{--pm:var(--brass)} .pm-ota{--pm:var(--muted)} .pm-other{--pm:var(--muted)}
.st-pending{background:var(--warn-soft);color:var(--warn)}
tr.pend td{background:color-mix(in srgb,var(--warn-soft) 45%,transparent)}
.nowrap{white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.acc-list{border-top:1px solid var(--line-2)}
.acc{border-bottom:1px solid var(--line-2)}
.acc:last-child{border-bottom:0}
.acc summary{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;list-style:none;border-left:3px solid var(--pm)}
.acc summary::-webkit-details-marker{display:none}
.acc summary:hover{background:var(--surface-2)}
.acc .acc-amt{margin-left:auto;font-weight:600}
.acc .chev{display:inline-block;transition:transform .15s;color:var(--muted);font-size:1.2rem;line-height:1}
.acc[open] .chev{transform:rotate(90deg)}
.acc[open] summary{background:var(--surface-2)}
.acc table td,.acc table th{padding-block:6px}
.disc-tab{border-top:1px solid var(--line-2)}
.disc-tab summary{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;list-style:none}
.disc-tab summary::-webkit-details-marker{display:none}
.disc-tab summary .muted{margin-left:auto}
.disc-tab .chev{display:inline-block;transition:transform .15s;color:var(--muted);font-size:1.2rem}
.disc-tab[open] .chev{transform:rotate(90deg)}
.disc-tab[open] summary{background:var(--surface-2)}
.disc-body{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line-2)}
.st-disc{background:var(--ok-soft);color:var(--ok)}
tr.disc-row td.num,tr.disc-row td:nth-child(3){color:var(--ok)}
#dlg{width:min(1180px,calc(100vw - 24px))}
.dlg-grid{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}
.dlg-main{display:flex;flex-direction:column;gap:18px;min-width:0}
.imgpane{position:sticky;top:0;display:flex;flex-direction:column;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.imgpane .section-t{margin:0}
.dropzone{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;border:1.5px dashed var(--line);border-radius:var(--r);padding:16px 10px;cursor:pointer;background:var(--surface);color:var(--ink)}
.dropzone:hover,.dropzone.over{border-color:var(--accent);background:var(--accent-soft)}
.dropzone small{color:var(--muted);font-size:.75rem;line-height:1.3}
.dz-plus{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:1.2rem;font-weight:600}
.thumbs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.thumb{position:relative;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--surface);aspect-ratio:1}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.thumb .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;line-height:1}
.thumb .tag{position:absolute;left:0;right:0;bottom:0;font-size:.66rem;padding:2px 6px;background:rgba(0,0,0,.55);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb.busy::after{content:"Saving…";position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.6);color:#000;font-size:.75rem}
.chip-key{border-style:solid;border-color:var(--accent);color:var(--accent);font-weight:600}
#lb{width:min(1000px,calc(100vw - 24px));background:#111}
#lb img{display:block;max-width:100%;max-height:calc(100dvh - 90px);margin:0 auto}
#lb .lb-f{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;color:#ddd;font-size:.85rem}
@media (max-width:760px){.dlg-grid{grid-template-columns:1fr}.imgpane{position:static}.thumbs{grid-template-columns:repeat(3,minmax(0,1fr))}}
.dfield{position:relative;display:flex;align-items:stretch;min-width:0}
.dfield .dtxt{flex:1;min-width:0;width:100%;max-width:100%;font-family:var(--f-mono);font-variant-numeric:tabular-nums;padding-right:36px}
.bar-row .dfield .dtxt{width:9.5em}
.dfield .dtxt.bad{border-color:var(--bad);background:var(--bad-soft)}
.dfield .dbtn{position:absolute;right:3px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);padding:5px;border-radius:4px;cursor:pointer;display:grid;place-items:center}
.dfield .dbtn:hover{color:var(--accent);background:var(--accent-soft)}

"use strict";
/* ---------- constants ---------- */

function todayBkk(){ return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Bangkok",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date()); }
const pad = n => String(n).padStart(2,"0");
function d2n(s){ const [y,m,d]=s.split("-").map(Number); return Math.round(Date.UTC(y,m-1,d)/864e5); }
function n2d(n){ const t=new Date(n*864e5); return t.getUTCFullYear()+"-"+pad(t.getUTCMonth()+1)+"-"+pad(t.getUTCDate()); }
function addDays(s,k){ return n2d(d2n(s)+k); }
const nightsBetween = (a,b) => d2n(b)-d2n(a);
const validDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s||"");

function unitRate(u,guests){ if(!u) return 0; const base=+u.rate||0, inc=Math.max(1,+u.baseOcc||(u.type==="dorm"?1:2)); return base+Math.max(0,(guests||1)-inc)*(+u.extraPerson||0); }
function priceLine(u){ const inc=Math.max(1,+u.baseOcc||(u.type==="dorm"?1:2)); return money(u.rate)+(u.type==="dorm"?" / bed":(+u.extraPerson?` (${inc} pax) +${money(u.extraPerson)}/extra · max ${u.capacity||inc}`:` · max ${u.capacity||inc}`)); }
function sortedUnits(all){ return S.units.filter(u=>unitProp(u)===S.prop&&(all||u.active!==false)).slice().sort((a,b)=>TYPE_ORDER.indexOf(a.type)-TYPE_ORDER.indexOf(b.type)||(a.order??0)-(b.order??0)||unitLabel(a).localeCompare(unitLabel(b))); }
function folio(b){
  const n = Math.max(0,nightsBetween(b.checkIn,b.checkOut));
  const room = LIVE(b.status) ? n*(+b.rate||0) : 0;
  const extras = isCancel(b.status) ? 0 : (b.charges||[]).filter(c=>!isDisc(c)).reduce((s,c)=>s+(+c.amount||0),0);
  const disc = isCancel(b.status) ? 0 : (b.charges||[]).filter(isDisc).reduce((s,c)=>s+(+c.amount||0),0);
  const paid = (b.payments||[]).filter(isIncome).reduce((s,p)=>s+(+p.amount||0),0);
  const pending = pendingOf(b).reduce((s,p)=>s+(+p.amount||0),0);
  const total = room+extras+disc;
  return {n,room,extras,disc,total,paid,pending,balance:Math.round((total-paid)*100)/100};

/* ---------- data writes ---------- */
async function guard(fn,okMsg){
  if(!S.db){ toast("Not connected to the shared database."); return false; }
  try{ await fn(); if(okMsg) toast(okMsg); return true; }
  catch(e){
    const c=e&&e.code;
    if(c==="invalid_argument"){ toast("You don't have permission to change this."); }
    else if(c==="quota_exceeded"){ toast("Storage is full. Ask the owner to archive old bookings."); }
    else if(c==="unavailable"){ toast("Connection hiccup. Try again in a moment."); }
    else { toast("Couldn't save: "+(e&&e.message||"unknown error")); }
    console.error(e); return false;
  }
}
const bRef = id => S.db.collection("bookings").doc(id);
async function patchBooking(b,patch,action,okMsg){
  const lh=lockHits(b,patch); if(lh.length){ if(!await lockGate(b,patch)) return false; action="[closed "+lh.map(monthName).join(", ")+"] "+(action||"Edited"); }
  const h=(b.history||[]).concat(action?[hist(action)]:[]).slice(-60);
  return guard(()=>bRef(b.id).update(Object.assign({},patch,{history:h,updatedAt:nowIso(),updatedBy:S.uid||null})),okMsg);
}

  if(!c||typeof c.use!=="function"){ S.noDb=true; render(); return; }
  const [db,user,dl]=await Promise.all([c.use("db"),c.use("user"),c.use("downloads")]);
  S.db=db; S.user=user; S.dl=dl;
  if(!db){ S.noDb=true; render(); return; }
  if(user){
    S.uid=await user.id(); S.isAdmin=await user.canEdit();
    const cw=await user.can("data.write"); S.canWrite = cw!==false;
  }
  $("#ro").hidden=S.canWrite;

    const d=s.exists?s.data():{};

    if(Array.isArray(d.extras)) S.settings.extras=d.extras;
    render();
  },onErr);
  db.collection("units").onSnapshot(s=>{ S.units=s.docs.map(d=>Object.assign({id:d.id},d.data())); S.ready=true; render(); cmSchedule(); },onErr);
  const windowStart=addDays(S.today,-400);
  db.collection("bookings").where("checkOut",">=",windowStart).onSnapshot(s=>{
    S.bookings=s.docs.map(d=>Object.assign({id:d.id},d.data())); S.ready=true; render(); if(S.open) renderDialogParts(); cmSchedule();
  },onErr);
  if(S.isAdmin) db.collection("expenses").onSnapshot(s=>{ S.expenses={}; s.docs.forEach(d=>S.expenses[d.id]=d.data()); if(S.view==="expenses"||S.view==="reports") render(); },onErr);
  db.collection("payouts").onSnapshot(s=>{ S.payouts={}; s.docs.forEach(d=>S.payouts[d.id]=d.data()); if(S.view==="reports") render(); },onErr);
  if(CM_ON) cmBoot();
}

/* ---------- Today / week / month switch ---------- */
function periodRange(mode,a){
  if(mode==="week"){ const back=(dow(a)+6)%7, f=addDays(a,-back); return {from:f,to:addDays(f,6)}; }
  if(mode==="month"){ const f=a.slice(0,7)+"-01"; return {from:f,to:addDays(ymAdd(a.slice(0,7),1)+"-01",-1)}; }
  return {from:a,to:a};
}
function periodTitle(mode,r){
  if(mode==="month") return monthName(r.from.slice(0,7));
  if(mode==="week") return `Week ${fd(r.from,{day:"numeric",month:"short"})} – ${fd(r.to,{day:"numeric",month:"short"})} ${r.to.slice(0,4)}`;
  return fd(r.from,{weekday:"long",day:"numeric",month:"long"})+(r.from.slice(0,4)!==S.today.slice(0,4)?" "+r.from.slice(0,4):"");
}
function periodSwitch(){
  const m=S.tMode||"day", a=S.tAnchor||S.today, cur=periodRange(m,S.today).from===periodRange(m,a).from;
  return `<div class="seg" role="radiogroup" aria-label="Period">${[["day","Today"],["week","This week"],["month","This month"]].map(([k,l])=>`<label><input type="radio" name="t-mode" value="${k}" ${m===k?"checked":""}><span>${l}</span></label>`).join("")}</div>
    <span class="nowrap" style="position:relative"><button class="btn small" data-act="t-move" data-k="-1" aria-label="Previous">←</button><button class="btn small" data-act="t-move" data-k="1" aria-label="Next">→</button><button class="btn small" data-act="t-cal" aria-label="Pick a ${m==="month"?"month":"date"}" title="Pick a ${m==="month"?"month":"date"}" aria-expanded="${S.tPick?"true":"false"}">${CAL_SVG}</button><input type="date" id="t-date" value="${esc(a)}" tabindex="-1" aria-hidden="true" style="position:absolute;right:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0">${S.tPick?monthPicker(a):""}${cur?"":`<button class="btn small ghost" data-act="t-now">Back to ${m==="day"?"today":m==="week"?"this week":"this month"}</button>`}</span>`;
}
function monthPicker(a){

function calStats(from,D){

/* ---------- IMPORT from Hoteliers Guru (reservation report .xlsx / .csv) ---------- */
const HG_CHAN = { "booking.com":"booking", "airbnb":"airbnb", "hostel world":"hostelworld", "hostelworld":"hostelworld", "agoda":"agoda", "expedia":"expedia", "trip.com":"tripcom", "hoteliers.guru":"direct" };
const HG_MON = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
const HG = { rows:null, plan:null, file:"", busy:false, cancelMissing:false };
function hgDate(v){
  if(v instanceof Date&&!isNaN(v)) return n2d(Math.round(Date.UTC(v.getFullYear(),v.getMonth(),v.getDate())/864e5));
  const s=String(v??"").trim(); let m=s.match(/^(\d{1,2})[\s\-]([A-Za-z]{3})[A-Za-z]*[\s\-,]+(\d{4})$/);
  if(m&&HG_MON[m[2].toLowerCase()]){ const iso=m[3]+"-"+pad(HG_MON[m[2].toLowerCase()])+"-"+pad(+m[1]); return validDate(iso)&&n2d(d2n(iso))===iso?iso:""; }
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  return parseDmy(s);
}
const hgNum = v => +String(v??"").replace(/[^0-9.\-]/g,"")||0;
const hgName = s => String(s||"").replace(/\s+Guest of .*$/i,"").replace(/\s+/g," ").trim();
const hgKey = s => hgName(s).toLowerCase().normalize("NFKD").replace(/[^a-z0-9฀-๿぀-鿿]/g,"");
function hgGroup(room){ const r=String(room||"").toLowerCase(); return /dorm|bed/.test(r)?"dorm":/roof/.test(r)?"rooftop":/private|room/.test(r)?"private":null; }
function hgChannel(name){ const k=String(name||"").trim().toLowerCase(); return HG_CHAN[k]||(k?k.replace(/[^a-z0-9]+/g,""):"direct"); }

/* Airbnb CSV: Reservations export or Earnings / Transaction history export (columns matched by name) */
function airbnbRows(grid,hi){
  const H=grid[hi].map(c=>String(c).trim().toLowerCase());
  const col=(...names)=>{ for(const n of names){ const i=H.indexOf(n); if(i>=0) return i; } return -1; };
  const C={no:col("confirmation code"),st:col("status"),type:col("type"),guest:col("guest name","guest"),ci:col("start date","check-in","check in","checkin date"),co:col("end date","check-out","check out","checkout date"),
    n:col("# of nights","nights","number of nights"),book:col("booked","booking date","booked on","date"),room:col("listing","listing name","listing title"),
    gross:col("gross earnings","gross"), fee:col("service fee","host fee","host service fee","airbnb service fee"), paid:col("amount","paid out","total payout","payout","earnings")};
  C.amt=C.gross>=0?C.gross:C.paid;
  if(C.ci<0||(C.co<0&&C.n<0)||C.amt<0) throw new Error("Airbnb file found, but it's missing the start date, end date/nights or earnings column.");
  const body=grid.slice(hi+1).filter(r=>String(r[C.no]??"").trim());
  // Airbnb CSV dates are always MM/DD/YYYY (month first)
  const date=v=>{ const t=String(v??"").trim(), m=t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
    if(m){ const mo=+m[1], d=+m[2], iso=m[3]+"-"+pad(mo)+"-"+pad(d); return mo>=1&&mo<=12&&n2d(d2n(iso))===iso?iso:""; }
    return hgDate(t)||(v instanceof Date?hgDate(v):""); };
  const by={};
  for(const r of body){
    const no=String(r[C.no]).trim(), type=C.type>=0?String(r[C.type]||"").trim().toLowerCase():"";
    if(type&&!/reservation|booking/.test(type)) continue; // payouts, adjustments, resolution rows
    const ci=date(r[C.ci]); let co=C.co>=0?date(r[C.co]):""; if(!co&&ci&&C.n>=0) co=addDays(ci,parseInt(r[C.n])||0);
    const st=C.st>=0?String(r[C.st]||"").trim():"";
    by[no]={no,chName:"Airbnb",channel:"airbnb",status:st||"Confirmed",cancelled:/cancel/i.test(st),book:C.book>=0?date(r[C.book]):"",room:C.room>=0?String(r[C.room]||"").trim():"Airbnb listing",
      guest:hgName(C.guest>=0?r[C.guest]:"")||"Airbnb guest",ci,co,...(()=>{
        // gross earnings is the room revenue; Airbnb's service fee becomes a discount; what's left is the payout
        const v=i=>i>=0?r2(Math.abs(hgNum(r[i]))):null, g=v(C.gross), f=v(C.fee), p=v(C.paid);
        const gross=g!=null?g:r2((p||0)+(f||0));            // no gross column: paid out + fee
        const fee=f!=null?f:(g!=null&&p!=null&&p<g?r2(g-p):0); // no fee column: gross − paid out
        return {total:gross,fee,payout:r2(gross-fee)}; })()};
  }
  return {rows:Object.values(by),title:"Airbnb",prop:S.prop,source:"Airbnb"};
}
async function hgParse(file){
  let grid;
  if(/\.csv$/i.test(file.name)){
    const txt=await file.text(); grid=[]; let row=[],cur="",q=false;
    for(let i=0;i<txt.length;i++){ const c=txt[i];
      if(q){ if(c==='"'){ if(txt[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
      else if(c==='"') q=true; else if(c===","){row.push(cur);cur="";} else if(c==="\n"||c==="\r"){ if(c==="\r"&&txt[i+1]==="\n") i++; row.push(cur); grid.push(row); row=[]; cur=""; } else cur+=c; }
    if(cur||row.length){ row.push(cur); grid.push(row); }
  } else {
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
    const wb=window.XLSX.read(await file.arrayBuffer(),{type:"array",cellDates:true});
    grid=window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:""});
  }
  const pi=grid.findIndex(r=>r.some(c=>/^payout\s*id$/i.test(String(c).trim()))&&r.some(c=>/^net$/i.test(String(c).trim())));
  if(pi>=0) return payoutRows(grid,pi);
  const ai=grid.findIndex(r=>r.some(c=>/^confirmation\s*code$/i.test(String(c).trim())));
  if(ai>=0) return airbnbRows(grid,ai);
  const hi=grid.findIndex(r=>r.some(c=>/reservation\s*number/i.test(String(c))));
  if(hi<0) throw new Error("This doesn't look like a Hoteliers Guru reservation report or an Airbnb export (no \"Reservation Number\" or \"Confirmation code\" column).");
  const H=grid[hi].map(c=>String(c).trim().toLowerCase()), col=n=>H.findIndex(h=>h===n);
  const C={no:col("reservation number"),ch:col("channel"),st:col("status"),by:col("reserved by"),book:col("book date"),room:col("room"),guest:col("guest"),ci:col("check-in"),co:col("check-out"),n:col("nights"),tot:col("booking total amount")>=0?col("booking total amount"):col("room total amount")};
  const miss=Object.entries(C).filter(([k,v])=>v<0&&k!=="by"&&k!=="n").map(([k])=>k);
  if(miss.length) throw new Error("Missing columns in the file: "+miss.join(", "));
  const title=String((grid[0]||[])[0]||""), propHit=propList().find(([k,p])=>p.name&&title.toLowerCase().includes(String(p.name).toLowerCase()));
  const rows=[];
  for(const r of grid.slice(hi+1)){
    const no=String(r[C.no]??"").trim(); if(!no||/summary/i.test(no)) continue;
    rows.push({no,chName:String(r[C.ch]||"").trim(),channel:hgChannel(r[C.ch]),status:String(r[C.st]||"").trim(),book:hgDate(r[C.book]),room:String(r[C.room]||"").trim(),
      guest:hgName(r[C.guest])||hgName(r[C.by])||"OTA guest",ci:hgDate(r[C.ci]),co:hgDate(r[C.co]),total:r2(hgNum(r[C.tot]))});
  }
  return {rows,title,prop:propHit?propHit[0]:S.prop};
}
/* ---------- Booking.com payout statement (Finance → Payouts → month_payouts-YYYY-MM.csv) ---------- */
function payoutRows(grid,hi){

  const miss=["no","amount","net","pd"].filter(k=>C[k]<0);

function payoutPlan(parsed){
  const items=[];

    const id="hg_"+r.no.replace(/[^A-Za-z0-9_-]/g,"").slice(0,60);
    const ex=S.bookings.find(b=>b.id===id)||S.bookings.find(b=>String(b.otaRef||"")===r.no);
    const fee=r2(r.amount-r.net), it={r,ex,fee,action:"apply",note:""};
    if(!/^reservation$/i.test(r.type)||!/^ok$/i.test(r.status)){ it.action="skip"; it.note=`${r.type||"Row"} · ${r.status||"—"}: check by hand`; items.push(it); continue; }
    if(!validDate(r.payDate)||!(r.net>0)){ it.action="skip"; it.note="No payout date or amount"; items.push(it); continue; }
    if(!ex){ it.action="missing"; it.note="Not in the PMS: import it from Hoteliers Guru first"; items.push(it); continue; }
    if(isCancel(ex.status)) it.note="Cancelled in the PMS: it will be restored";

    if(pay&&Math.abs(+pay.amount-r.net)<0.01&&pay.date===r.payDate&&Math.abs(feeNow-it.fee)<0.01&&!isCancel(ex.status)){ it.action="same"; items.push(it); continue; }

    if(cl.length&&!S.isAdmin){ it.action="skip"; it.note=`${cl.map(monthName).join(", ")} closed`; }
    else if(cl.length) it.note=(it.note?it.note+" · ":"")+`In closed ${cl.map(monthName).join(", ")}`;
    items.push(it);
  }
  return {kind:"payout",items,source:parsed.source,prop:S.prop};
}

async function payoutImport(P){
  let done=0, fail=0; const work=P.items.filter(i=>i.action==="apply");
  for(const i of work){
    const r=i.r, b=i.ex, n=nightsBetween(b.checkIn,b.checkOut);
    const fee={id:"ota_fee",kind:"discount",src:"payout",desc:"Discount · Booking.com commission & fees",amount:-i.fee,reason:"OTA commission",date:b.checkIn,detail:{commission:r.comm,vat:r.vat,paymentFee:r.psf},by:S.uid||null};
    const pays=(b.payments||[]).slice();
    let k=pays.findIndex(p=>p.payoutId===r.payoutId&&!p.voided);
    if(k<0) k=pays.findIndex(p=>p.id==="hg_pay");
    if(k<0) k=pays.findIndex(p=>payKey(p)==="ota"&&(isPending(p)||!p.payoutId));
    const base=k>=0?pays[k]:{id:"hg_pay",createdAt:nowIso(),by:S.uid||null};
    const pay=Object.assign({},base,{mk:"ota",method:"Prepaid via OTA",amount:r.net,status:"collected",voided:false,date:r.payDate,expDate:base.expDate||base.date||b.checkIn,expAmount:base.expAmount!=null?base.expAmount:base.amount,collectedAt:nowIso(),collectedBy:S.uid||null,payoutId:r.payoutId,note:`Booking.com payout ${r.payoutId} · ${dmy(r.payDate)}`});
    if(k>=0) pays[k]=pay; else pays.push(pay);
    const patch={payments:pays,charges:(b.charges||[]).filter(c=>c.id!=="ota_fee").concat([fee])};
    if(n&&Math.abs(folio(b).room-r.amount)>=1) patch.rate=r.amount/n;
    if(isCancel(b.status)) Object.assign(patch,{status:hgStatusFor(b.checkIn,b.checkOut),voidReason:null});
    const h=(b.history||[]).concat([hist(`Booking.com payout ${dmy(r.payDate)}: ${money(r.amount)} − ${money(i.fee)} commission & fees = ${money(r.net)} collected (${r.payoutId})`)]).slice(-60);
    try{ await bRef(b.id).update(Object.assign(patch,{history:h,updatedAt:nowIso(),updatedBy:S.uid||null})); done++; }
    catch(e){ fail++; console.error(e); }
    if(done%10===0){ const g=$("#hg-go"); if(g) g.textContent=`Recording… ${done}/${work.length}`; }
  }
  HG.busy=false; closeDlg();
  toast(fail?`Recorded ${done} payouts, ${fail} failed. Import the file again.`:`Recorded ${done} Booking.com payout${done===1?"":"s"}`);
}
function hgRoomMap(){ try{ return JSON.parse(localStorage.getItem("hh-roommap")||"{}"); }catch(e){ return {}; } }
function hgGroupFor(room){ const m=hgRoomMap()[room]; return m==="skip"?"skip":(m||hgGroup(room)); }
function hgPlan(parsed){

async function hgFile(file){
  if(!file) return; HG.file=file.name; toast("Reading file…");
  try{ const parsed=await hgParse(file); if(!parsed.rows.length) throw new Error("No reservations found in the file."); HG.parsed=parsed; HG.plan=parsed.kind==="payout"?payoutPlan(parsed):hgPlan(parsed); hgRender(); }
  catch(e){ toast(e.message||"Couldn't read the file."); }
}
async function hgImport(){
  const P=HG.plan; if(!P||HG.busy) return; HG.busy=true; hgRender();
  if(P.kind==="payout") return payoutImport(P);
  const work=P.items.filter(i=>i.action==="new"||i.action==="update");
  let done=0, fail=0;
  for(const i of work){
    const r=i.r, n=nightsBetween(r.ci,r.co);
    // not every OTA booking is paid yet: it waits as "awaiting collection" and only counts as income once someone clicks Collect
    const fee=+r.fee||0, payout=r.payout!=null?r.payout:r.total;
    const pay={id:"hg_pay",mk:"ota",method:"Prepaid via OTA",amount:payout,note:`Expected from ${r.chName}`,status:"pending",date:r.ci,expDate:r.ci,createdAt:nowIso(),by:S.uid||null};
    const feeCharge=fee>0?{id:"ota_fee",kind:"discount",desc:`Discount · ${r.chName} service fee`,amount:-fee,reason:"OTA commission",date:r.ci,by:S.uid||null}:null;
    const data={guestName:r.guest,checkIn:r.ci,checkOut:r.co,rate:n?r.total/n:0,channel:r.channel,otaRef:r.no,unitId:i.unit.id,prop:P.prop,overbooked:!!i.over,source:"hg",hgBookDate:r.book||"",hgStatus:r.status};
    try{
      if(!i.ex){
        await S.db.collection("bookings").doc(i.id).set(Object.assign({},data,{guests:1,status:hgStatusFor(r.ci,r.co),ref:r.no.slice(-8).toUpperCase(),charges:feeCharge?[feeCharge]:[],payments:[pay],notes:"",createdAt:nowIso(),createdBy:S.uid||null,
          history:[{at:nowIso(),by:S.uid||null,action:`Imported from ${P.source} (${r.chName} ${r.no}) · ${fee?`${money(r.total)} − ${money(fee)} service fee = `:""}${money(payout)} awaiting collection`}]}));
      } else {
        const old=(i.ex.payments||[]).find(p=>p.id==="hg_pay");
        // keep money that was already collected; only refresh a payment that is still waiting (or was voided by a cancellation)
        const keepOld=old&&!old.voided&&!isPending(old);
        const payments=(i.ex.payments||[]).filter(p=>p.id!=="hg_pay").concat([keepOld?old:(old&&isPending(old)?Object.assign({},old,{amount:payout,date:r.ci,expDate:r.ci}):pay)]);
        const payoutFee=(i.ex.charges||[]).find(c=>c.id==="ota_fee"&&c.src==="payout");
        const charges=(i.ex.charges||[]).filter(c=>c.id!=="ota_fee").concat(feeCharge?[feeCharge]:payoutFee?[payoutFee]:[]);
        const patch=Object.assign({},data,{payments,charges}); if(isCancel(i.ex.status)) Object.assign(patch,{status:hgStatusFor(r.ci,r.co),voidReason:null});
        const h=(i.ex.history||[]).concat([hist(`Updated from ${P.source} import`)]).slice(-60);
        await S.db.collection("bookings").doc(i.id).update(Object.assign(patch,{history:h,updatedAt:nowIso(),updatedBy:S.uid||null}));
      }
      done++;
    }catch(e){ fail++; console.error(e); }
    if(done%10===0){ const g=$("#hg-go"); if(g) g.textContent=`Importing… ${done}/${work.length}`; }
  }
  for(const i of P.items.filter(x=>x.action==="cancel")){ const b=i.ex;
    try{ await bRef(b.id).update({status:"cancelled",voidReason:`Cancelled on ${i.r.chName}`,voidedAt:nowIso(),voidedBy:S.uid||null,payments:(b.payments||[]).map(p=>Object.assign({},p,{voided:true})),history:(b.history||[]).concat([hist(`Cancelled on ${i.r.chName} (from ${P.source} import)`)]).slice(-60),updatedAt:nowIso()}); done++; }
    catch(e){ fail++; console.error(e); } }
  if(HG.cancelMissing) for(const b of P.missing){
    try{ await bRef(b.id).update({status:"cancelled",voidReason:"Not in Hoteliers Guru export (cancelled on OTA)",voidedAt:nowIso(),voidedBy:S.uid||null,
      payments:(b.payments||[]).map(p=>Object.assign({},p,{voided:true})),history:(b.history||[]).concat([hist("Cancelled: missing from Hoteliers Guru export")]).slice(-60),updatedAt:nowIso()}); done++; }
    catch(e){ fail++; console.error(e); }
  }
  HG.busy=false; closeDlg();
  toast(fail?`Imported ${done}, ${fail} failed. Try importing the file again.`:`Imported ${done} change${done===1?"":"s"} from ${P.source}`);
}

function readForm(){
  const g=id=>$("#f-"+id)?.value??""; const opt=id=>{ const e=$("#f-"+id); return e?e.value.trim():undefined; };
  return {guestName:g("guestName").trim(),phone:opt("phone"),email:opt("email"),nationality:opt("nationality"),idNumber:opt("idNumber"),
    unitId:g("unitId"),checkIn:g("checkIn"),checkOut:g("checkOut"),guests:Math.max(1,parseInt(g("guests"))||1),rate:Math.max(0,(()=>{const e=$("#f-rate"),v=+(e?.value)||0,f=e?.dataset.full;return f!==undefined&&f!==""&&v===r2(f)?+f:v;})()),
    channel:g("channel"),otaRef:opt("otaRef"),notes:g("notes").trim(),beds:Math.max(1,parseInt(g("beds"))||1)};
}
function newDisc(){ const v=$("#f-discVal"); if(!v) return {type:"pct",val:0}; return {type:(document.querySelector('input[name="f-discType"]:checked')||{}).value||"pct",val:+v.value||0,reason:($("#f-discReason").value||"").trim()}; }
function newGross(d,u){ if(!validDate(d.checkIn)||!validDate(d.checkOut)||d.checkOut<=d.checkIn) return 0; const beds=(u&&u.type==="dorm")?d.beds:1; return nightsBetween(d.checkIn,d.checkOut)*d.rate*beds; }

function syncPay(d,u){

  const a=$("#f-payAmt"); if(a&&!a.dataset.touched){ const t=newTotal(d||readForm(),u||unitById($("#f-unitId").value)); a.value=t?f2(t):""; }
}
function freeBedsInGroup(u,ci,co,need,exceptId){
  const beds=sortedUnits().filter(x=>x.type==="dorm"&&(x.group||"")===(u.group||""));
  const ordered=[u].concat(beds.filter(x=>x.id!==u.id));
  return ordered.filter(x=>!conflictsFor(x.id,ci,co,exceptId).length).slice(0,need);
}
function formHints(){
  const box=$("#f-msg"); if(!box) return;
  const d=readForm(), o=S.open, u=unitById(d.unitId);
  $("#beds-wrap").hidden=!( !o.id && u && u.type==="dorm");
  const msgs=[];
  if(!validDate(d.checkIn)||!validDate(d.checkOut)||d.checkOut<=d.checkIn) msgs.push(["err","Check-out must be after check-in."]);
  else{
    const n=nightsBetween(d.checkIn,d.checkOut);
    if(u){
      if(!o.id&&u.type==="dorm"&&d.beds>1){ const free=freeBedsInGroup(u,d.checkIn,d.checkOut,d.beds,null); if(free.length<d.beds) msgs.push(["err",`Only ${free.length} free bed${free.length===1?"":"s"} in ${esc(u.group||"this dorm")} for these nights.`]); else msgs.push(["ok",`Will book ${free.map(x=>esc(x.name)).join(", ")} · ${n} night${n===1?"":"s"} · ${money(n*d.rate*d.beds)} total.`]); }
      else{ const c=conflictsFor(u.id,d.checkIn,d.checkOut,o.id); if(c.length) msgs.push(["err",`${esc(unitLabel(u))} is already booked by ${c.map(x=>esc(x.guestName)+" ("+esc(fd(x.checkIn))+"–"+esc(fd(x.checkOut))+")").join(", ")}.`]); else msgs.push(["ok",`${n} night${n===1?"":"s"} · ${money(n*d.rate)} room total.`]); }
      if(u.type!=="dorm"&&d.guests>(u.capacity||2)) msgs.push(["warn",`${esc(unitLabel(u))} sleeps ${u.capacity||2}.`]);
    }
  }
  box.innerHTML=msgs.map(([k,m])=>`<div class="${k==="err"?"errbox":k==="warn"?"warnbox":"muted"}">${m}</div>`).join("");
  { const g=newGross(d,u), x=newDisc(), da=discAmount(x.type,x.val,g); if(!o.id&&da) msgs.push(["ok",`Discount −${money(da)} → total ${money(g-da)}.`]); if(!o.id&&da&&!x.reason) msgs.push(["warn","Add a reason for the discount."]); box.innerHTML=msgs.map(([k,m])=>`<div class="${k==="err"?"errbox":k==="warn"?"warnbox":"muted"}">${m}</div>`).join(""); }
  syncPay(d,u);
  return !msgs.some(m=>m[0]==="err");
}
async function saveBooking(){

    const groupId=targets.length>1?"G"+rid():null;

    if(btn) btn.disabled=false;

    const okGo=await ask(`<h3 style="margin-bottom:10px">Confirm this booking?</h3>
      <div class="totals" style="grid-template-columns:auto 1fr;justify-content:start;padding:0;gap:6px 16px">
        <span class="muted">Guest</span><span><b>${esc(d.guestName)}</b> · ${d.guests} guest${d.guests===1?"":"s"}</span>
        <span class="muted">${targets.length>1?"Beds":"Room"}</span><span>${targets.map(t=>esc(unitLabel(t))).join(", ")}</span>
        <span class="muted">Stay</span><span>${esc(fdw(d.checkIn))} → ${esc(fdw(d.checkOut))} · ${nN} night${nN===1?"":"s"}</span>
        <span class="muted">Channel</span><span>${esc(chanLabel(d.channel))}</span>
        ${discEach?`<span class="muted">Discount</span><span class="num" style="color:var(--ok)">−${money(discEach*targets.length)} · ${esc(dx.reason)}</span>`:""}
        <span class="muted">Total</span><span class="num"><b>${money(tot)}</b></span>
        ${(o.newImgs||[]).length?`<span class="muted">Images</span><span>${o.newImgs.length} attached</span>`:""}
        <span class="muted">Payment</span><span>${payLeft>0?`<span class="pm-dot pm-${pk}"></span>${money(payLeft)} by ${esc(payLabel(pk))} <span class="muted">· to collect</span>${payLeft<tot?` · <span class="due">${money(tot-payLeft)} still owed</span>`:""}`:`<span class="due">Not paid yet</span>`}</span>
      </div>`,"Confirm booking");
    if(!okGo) return;

    const ok=await guard(async()=>{
      for(const t of targets){

        const payments=amt>0?[{id:rid(),mk:pk,method:payLabel(pk),amount:amt,note:payNote,status:"pending",date:S.today,createdAt:nowIso(),by:S.uid||null}]:[];
        const h=[hist("Booking created"+(groupId?` (group of ${targets.length} beds)`:""))].concat(amt>0?[hist(`Expected payment ${money(amt)} by ${payLabel(pk)} (not collected yet)`)]:[]);
        await ref.set(Object.assign({},base,{unitId:t.id,prop:unitProp(t),status:"confirmed",ref:ref.id.slice(-6).toUpperCase(),groupId,charges:discEach?[{id:rid(),kind:"discount",desc:`Discount${dx.type==="pct"?` ${Math.min(100,dx.val)}%`:""} · ${dx.reason}`,amount:-discEach,pct:dx.type==="pct"?Math.min(100,dx.val):null,reason:dx.reason,date:S.today,by:S.uid||null}]:[],payments,createdAt:nowIso(),createdBy:S.uid||null,history:h}));
      }

    }, targets.length>1?`${targets.length} beds booked`:"Booking created");

async function compressImage(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error("This file isn't an image the browser can read (try JPG or PNG).")); i.src=url; });
    let max=1400, q=0.78, out="";
    for(let tries=0;tries<8;tries++){
      const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
      const c=document.createElement("canvas"); c.width=Math.round(img.naturalWidth*sc); c.height=Math.round(img.naturalHeight*sc);
      const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
      out=c.toDataURL("image/jpeg",q);
      if(out.length<230000) return out;
      if(q>0.5) q-=0.12; else max=Math.round(max*0.8);
    }
    return out;
  } finally { URL.revokeObjectURL(url); }
}

async function makeThumb(dataUrl){
  const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=dataUrl; });
  const sc=Math.min(1,160/Math.max(img.naturalWidth,img.naturalHeight)), c=document.createElement("canvas");
  c.width=Math.max(1,Math.round(img.naturalWidth*sc)); c.height=Math.max(1,Math.round(img.naturalHeight*sc));
  const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg",0.7);
}

  }

  }

    const ok=await ask(`<h3 style="margin-bottom:8px">Cancel this booking?</h3>

        <span class="muted">Stay</span><span>${esc(fdw(b.checkIn))} → ${esc(fdw(b.checkOut))}</span>
      </div>
      ${incTot?`<div class="errbox" style="margin-top:12px"><b>${money(incTot)}</b> will be removed from income:<br>${Object.keys(byDay).sort().map(d=>`${esc(fdw(d))}: ${byDay[d].map(p=>`${money(p.amount)} ${esc(payLabel(payKey(p)))}`).join(", ")}`).join("<br>")}<br><small>Give the money back to the guest if it was really received.</small></div>`:`<p class="muted" style="margin:12px 0 0">No collected payments, so daily income doesn't change.</p>`}
      ${pend.length?`<p class="muted" style="margin:8px 0 0">${pend.length} uncollected payment${pend.length===1?"":"s"} will be dropped too.</p>`:""}
      <p class="muted" style="margin:8px 0 0">The room is freed for these dates. The booking stays on record as Cancelled (red, crossed out).</p>

    return res;

function monthRange(off){ const [y,m]=S.today.split("-").map(Number); const d=new Date(Date.UTC(y,m-1+off,1)); const from=n2d(Math.round(d.getTime()/864e5)); const nx=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,1)); return {from,to:addDays(n2d(Math.round(nx.getTime()/864e5)),-1)}; }

// Per-stay adjustments: guest discounts (disc) and the Airbnb service fee (fee, an OTA cost), both as positive baht.
function stayAdj(b){ let disc=0,fee=0; for(const c of b.charges||[]) if(isDisc(c)){ const a=-(+c.amount||0); if(c.id==="ota_fee") fee+=a; else disc+=a; } return {disc,fee}; }
function nightNet(b){ const N=nightsBetween(b.checkIn,b.checkOut); return N>0?(+b.rate||0)-stayAdj(b).disc/N:0; }
function computeReport(bks,from,to){
  const end=addDays(to,1), days=Math.max(0,nightsBetween(from,end));
  const units=sortedUnits(), byType={};
  for(const t of TYPE_ORDER) byType[t]={avail:units.filter(u=>u.type===t).length*days,sold:0,rev:0};
  const chans={}, pay={}, plist=[], daily=[...Array(days)].map(()=>0), dailyRev=[...Array(days)].map(()=>0);
  const dayIdx=d=>nightsBetween(from,d);
  let roomRev=0,sold=0,extras=0,discounts=0,collected=0,comm=0,cancels=0,noshows=0,voids=0,arrivals=0;
  for(const b of bks){
    if(!inProp(b)) continue;
    if(b.checkIn>=from&&b.checkIn<end){ if(isCancel(b.status)) cancels++; else if(b.status==="no_show") noshows++; else arrivals++; }
    // Stay discounts and the Airbnb service fee are spread evenly over the nights of the stay, so a stay that crosses
    // into the next month puts each night's share in the month that night belongs to. Extras count on the day posted.
    const N=nightsBetween(b.checkIn,b.checkOut), spread=LIVE(b.status)&&N>0, sp=spread?stayAdj(b):{disc:0,fee:0};
    if(!isCancel(b.status)) for(const c of b.charges||[]){ if(spread&&isDisc(c)) continue; if(c.date>=from&&c.date<end){ const a=+c.amount||0; if(isDisc(c)) discounts+=-a; else extras+=a; const i=dayIdx(c.date); if(i>=0&&i<days) dailyRev[i]+=a; } }
    for(const p of b.payments||[]) if(isIncome(p)&&p.date>=from&&p.date<end){ plist.push(Object.assign({},p,{_b:b})); collected+=+p.amount||0; }
    if(!LIVE(b.status)) continue;
    const s=b.checkIn>from?b.checkIn:from, e=b.checkOut<end?b.checkOut:end, n=nightsBetween(s,e); if(n<=0) continue;
    const u=unitById(b.unitId), r=n*(+b.rate||0), cp=sp.fee>0||(b.charges||[]).some(c=>c.id==="ota_fee")?0:+(S.settings.channels[b.channel]?.comm||0);
    const dShare=sp.disc*n/N, fShare=sp.fee*n/N;
    roomRev+=r; sold+=n; comm+=r*cp/100+fShare; discounts+=dShare;
    if(u&&byType[u.type]){ byType[u.type].sold+=n; byType[u.type].rev+=r; }
    const ch=chans[b.channel]||(chans[b.channel]={stays:0,nights:0,rev:0,comm:0}); ch.stays++; ch.nights+=n; ch.rev+=r; ch.comm+=r*cp/100+fShare;
    const off=nightsBetween(from,s), per=(+b.rate||0)-sp.disc/N; for(let i=0;i<n;i++){ daily[off+i]++; dailyRev[off+i]+=per; }
  }
  const avail=units.length*days;
  return {days,avail,sold,roomRev,extras,discounts,collected,comm,byType,chans,pay:payBreak(plist),plist,daily,dailyRev,units:units.length,cancels,noshows,voids,arrivals};
}

/* ---------- monthly report helpers ---------- */
const OTA_CH = ["booking","airbnb","hostelworld","expedia","tripcom","agoda"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function isFullMonth(from,to){ return validDate(from)&&validDate(to)&&from.slice(8)==="01"&&from.slice(0,7)===to.slice(0,7)&&addDays(to,1).slice(8)==="01"; }
function monthName(ym){ const [y,m]=ym.split("-").map(Number); return MONTHS[m-1]+" "+y; }
function prevRange(from,to){
  if(isFullMonth(from,to)){ const pf=addDays(from,-1).slice(0,7)+"-01"; return {from:pf,to:addDays(from,-1)}; }
  const n=nightsBetween(from,addDays(to,1)); return {from:addDays(from,-n),to:addDays(from,-1)};
}
function periodLabel(from,to){ return isFullMonth(from,to)?monthName(from.slice(0,7)):dmy(from)+" – "+dmy(to); }
function withProp(p,fn){ const o=S.prop; S.prop=p; try{ return fn(); } finally{ S.prop=o; } }
function repProps(){ const keys=propList().map(([k])=>k).filter(k=>S.units.some(u=>unitProp(u)===k)); return S.repScope==="all"&&keys.length?keys:[S.prop]; }
function payoutId(prop,ym){ return prop+"__"+ym; }
function payoutFor(prop,ym,ch){ const d=S.payouts[payoutId(prop,ym)]; return d&&d.channels&&d.channels[ch]||null; }
const payoutCost = p => r2((+p.commission||0)+(+p.fees||0)+(+p.vat||0));
function repFor(prop,from,to){
  return withProp(prop,()=>{
    const R=computeReport((S.repData||[]).filter(b=>b.checkIn<=to&&inProp(b)),from,to);
    R.prop=prop; R.estComm=R.comm;
    if(isFullMonth(from,to)){ const ym=from.slice(0,7);
      for(const ch of Object.keys(Object.assign({},R.chans,(S.payouts[payoutId(prop,ym)]||{}).channels||{}))){ const p=payoutFor(prop,ym,ch); if(!p) continue;
        const x=R.chans[ch]||(R.chans[ch]={stays:0,nights:0,rev:0,comm:0}); x.estComm=x.comm; x.comm=payoutCost(p); x.actual=true; x.inv=p; }
      R.comm=Object.values(R.chans).reduce((s,x)=>s+x.comm,0); }
    return R;
  });
}
function mergeReports(list){
  if(list.length===1) return list[0];
  const M={days:list[0].days,avail:0,sold:0,roomRev:0,extras:0,discounts:0,collected:0,comm:0,estComm:0,cancels:0,noshows:0,voids:0,arrivals:0,units:0,byType:{},chans:{},plist:[],daily:list[0].daily.map(()=>0),dailyRev:list[0].daily.map(()=>0)};
  for(const t of TYPE_ORDER) M.byType[t]={avail:0,sold:0,rev:0};
  for(const R of list){
    for(const k of ["avail","sold","roomRev","extras","discounts","collected","comm","estComm","cancels","noshows","voids","arrivals","units"]) M[k]+=R[k]||0;
    for(const t of TYPE_ORDER) for(const k of ["avail","sold","rev"]) M.byType[t][k]+=R.byType[t][k];
    for(const [c,x] of Object.entries(R.chans)){ const m=M.chans[c]||(M.chans[c]={stays:0,nights:0,rev:0,comm:0}); m.stays+=x.stays; m.nights+=x.nights; m.rev+=x.rev; m.comm+=x.comm; m.np=(m.np||0)+1; if(x.actual){ m.actual=true; m.na=(m.na||0)+1; } }

/* ---------- EXPENSES & PROFIT (owner only) ---------- */
const EXP_CATS = ["Rent","Staff salaries","Electricity & water","Internet & software","Channel manager / OTA tools","Laundry & linen","Cleaning & guest supplies","Repairs & maintenance","Marketing","Bank & payment fees","Taxes & licences","Other"];
const ymAdd = (ym,k) => { const [y,m]=ym.split("-").map(Number); const d=new Date(Date.UTC(y,m-1+k,1)); return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1); };
const ymDays = ym => nightsBetween(ym+"-01", ymAdd(ym,1)+"-01");
function fixedAmountFor(e,ym){
  if(e.from&&ym<e.from) return 0; if(e.to&&ym>e.to) return 0;
  const hist=(e.amounts||[]).filter(a=>a.from<=ym).sort((a,b)=>a.from.localeCompare(b.from));
  return hist.length?+hist[hist.length-1].amount||0:0;
}
function expScopeProps(props){ // which expense "prop" keys belong to a report scope
  const all=propList().map(([k])=>k).filter(k=>S.units.some(u=>unitProp(u)===k));
  const set=new Set(props); if(props.length>=all.length||all.length<=1) set.add("shared"); return set;
}
function expensesFor(props,from,to){
  const keys=expScopeProps(props), end=addDays(to,1), byCat={}, lines=[]; let total=0, sharedLeft=0;
  const add=(cat,amt,line)=>{ if(!amt) return; byCat[cat]=(byCat[cat]||0)+amt; total+=amt; lines.push(Object.assign({amt},line)); };
  for(const e of Object.values(S.expenses)){
    if(e.kind==="fixed"){
      for(let ym=from.slice(0,7); ym<=to.slice(0,7); ym=ymAdd(ym,1)){
        const mf=ym+"-01", mt=ymAdd(ym,1)+"-01", s=from>mf?from:mf, t=end<mt?end:mt, days=nightsBetween(s,t); if(days<=0) continue;
        const amt=r2(fixedAmountFor(e,ym)*days/ymDays(ym));
        if(keys.has(e.prop)) add(e.category,amt,{e,ym,fixed:true}); else if(e.prop==="shared") sharedLeft+=amt;
      }
    } else if(e.date>=from&&e.date<end){ if(keys.has(e.prop)) add(e.category,+e.amount||0,{e}); else if(e.prop==="shared") sharedLeft+=+e.amount||0; }
  }
  return {byCat,total:r2(total),lines,sharedLeft:r2(sharedLeft)};
}
function profitOf(R,X){ const gross=R.roomRev+R.extras-R.discounts; const net=gross-R.comm; return {gross,comm:R.comm,net,exp:X.total,profit:net-X.total,margin:gross?Math.round((net-X.total)/gross*1000)/10:0}; }
function propName(k){ return k==="shared"?"Shared (both locations)":withProp(k,()=>propInfo().name); }

async function expEdit(id,kind){
  const e=id?S.expenses[id]:{kind,prop:S.prop,category:kind==="fixed"?"Rent":"Other",name:"",amount:"",date:S.today,from:S.expMonth||S.today.slice(0,7),to:"",amounts:[]};

/* ---------- MONTH CLOSE ---------- */
function closedInfo(prop,ym){ const c=(S.settings.closedMonths||{})[prop]; return c&&c[ym]||null; }
function monthsOf(ci,co){ const out=[]; if(!validDate(ci)||!validDate(co)) return out; for(let ym=ci.slice(0,7); ym<=addDays(co,-1).slice(0,7); ym=ymAdd(ym,1)) out.push(ym); return out; }
function bookingProp(b){ return b.prop||unitProp(unitById(b.unitId)); }
function lockHits(b,patch){ // closed months a change would alter
  const prop=patch&&patch.unitId?unitProp(unitById(patch.unitId)):bookingProp(b), hits=new Set();
  const isClosed=ym=>closedInfo(prop,ym)||closedInfo(bookingProp(b),ym);
  const nb=Object.assign({},b,patch||{});
  const stayKeys=["checkIn","checkOut","rate","status","unitId","channel"];
  if(!b.id||stayKeys.some(k=>patch&&k in patch&&JSON.stringify(patch[k])!==JSON.stringify(b[k]))) for(const ym of monthsOf(b.checkIn,b.checkOut).concat(monthsOf(nb.checkIn,nb.checkOut))) if(isClosed(ym)) hits.add(ym);
  const diff=(oldL,newL)=>{ const sig=x=>JSON.stringify([x.amount,x.date,x.voided,x.status,x.mk]); const om=new Map((oldL||[]).map(x=>[x.id,x])), nm=new Map((newL||[]).map(x=>[x.id,x]));
    for(const [id,x] of om) if(!nm.has(id)||sig(nm.get(id))!==sig(x)) { if(x.date&&isClosed(x.date.slice(0,7))) hits.add(x.date.slice(0,7)); }
    for(const [id,x] of nm) if(!om.has(id)||sig(om.get(id))!==sig(x)) { if(x.date&&isClosed(x.date.slice(0,7))) hits.add(x.date.slice(0,7)); } };
  if(patch&&"charges" in patch) diff(b.charges,patch.charges);
  if(patch&&"payments" in patch) diff(b.payments,patch.payments);
  return [...hits].sort();
}
async function lockGate(b,patch){
  const hits=lockHits(b,patch); if(!hits.length) return true;
  const names=hits.map(monthName).join(", ");
  if(!S.isAdmin){ toast(`${names} ${hits.length>1?"are":"is"} closed. Ask the owner to make this change.`); return false; }
  return ask(`<p><b>${esc(names)}</b> ${hits.length>1?"are":"is"} closed for reporting.</p><p class="muted">This change will alter numbers already reported. Make it anyway? It's recorded in the activity log.</p>`,"Change anyway");
}
async function setMonthClosed(props,ym,close){
  const cm=JSON.parse(JSON.stringify(S.settings.closedMonths||{}));
  for(const p of props){ cm[p]=cm[p]||{}; if(close) cm[p][ym]={at:nowIso(),by:S.uid||null}; else delete cm[p][ym]; }
  await guard(()=>S.db.doc("settings/main").update({closedMonths:cm}),close?`${monthName(ym)} closed`:`${monthName(ym)} reopened`);
}

function actType(a){ a=String(a||"");

  if(/^(Cancelled|Room removed)/i.test(a)) return "cancel";
  if(/^Discount/i.test(a)) return "discount";

  if(/^(Collected|Uncollected|Payment|Expected payment)/i.test(a)) return "payment";

}

/* ---------- CHANNEL MANAGER ---------- */
const CM_SERVER = "Holy Channel Manager";
const CM_OTA = ["booking","agoda","hostelworld","airbnb"];
const CM_DAYS = 365;
const CM = { mcp:null, conn:"off", connMsg:"", status:null, setup:null, cfg:{}, ari:{}, logs:[], syncing:false, again:false, importing:false,
  started:false, schedT:null, calStart:null, calDays:14, showCh:false, tab:"rates", holder:"t"+Math.random().toString(36).slice(2,9), bulk:null };

const slug = s => String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "x";
function cmGid(u){ return u.type==="dorm" ? "dorm-"+slug(u.group||"dorm") : u.type; }
function cmGroups(prop){
  const out={};
  for(const u of S.units){ if(unitProp(u)!==prop||u.active===false) continue;
    const gid=cmGid(u); const g=out[gid]||(out[gid]={gid,type:u.type,label:u.type==="dorm"?(u.group||"Dorm"):u.type==="rooftop"?TYPES.rooftop:"Private rooms",units:[],rate:Infinity,baseOcc:u.baseOcc,extraPerson:u.extraPerson,order:u.order??0});
    g.units.push(u); g.rate=Math.min(g.rate,+u.rate||0); g.order=Math.min(g.order,u.order??0); }
  return Object.values(out).map(g=>Object.assign(g,{rate:isFinite(g.rate)?g.rate:0,unitLabel:g.type==="dorm"?"beds":g.units.length===1?"room":"rooms"}))
    .sort((a,b)=>TYPE_ORDER.indexOf(a.type)-TYPE_ORDER.indexOf(b.type)||a.order-b.order);
}
const ariId=(prop,gid,date)=>`${prop}__${gid}__${date.slice(0,7)}`;
function ariGet(prop,gid,date){ const d=CM.ari[ariId(prop,gid,date)]; return (d&&d.days&&d.days[date.slice(8)])||{}; }
function cmBase(prop,g,date){ const a=ariGet(prop,g.gid,date); return a.rate!=null&&+a.rate>0?+a.rate:g.rate; }
function cmMarkup(ch){ const c=S.settings.channels[ch]||{}; return c.markup!=null?+c.markup:(+c.comm||0); }
const cmChRate=(base,ch)=>r2(base*(1+cmMarkup(ch)/100));
function cmAvailMap(prop,groups,from,days){
  const out={}; const end=addDays(from,days);
  for(const g of groups){ const arr=new Array(days).fill(g.units.length); const ids=new Set(g.units.map(u=>u.id));
    for(const b of S.bookings){ if(!ids.has(b.unitId)||!LIVE(b.status)||b.checkOut<=from||b.checkIn>=end) continue;
      const s=Math.max(0,nightsBetween(from,b.checkIn)), e=Math.min(days,nightsBetween(from,b.checkOut));
      for(let i=s;i<e;i++) arr[i]--; }
    out[g.gid]=arr.map(n=>Math.max(0,n)); }
  return out;
}
function cmDesired(prop){
  const cfg=CM.cfg[prop]||{}, groups=cmGroups(prop), from=S.today, avail={}, rates={};
  const am=cmAvailMap(prop,groups,from,CM_DAYS);
  for(const g of groups){ const m=(cfg.groups||{})[g.gid]; if(!m||!m.room_type_id) continue;
    avail[g.gid]={from,v:am[g.gid]};
    for(const ch of CM_OTA){ const plan=m.plans&&m.plans[ch]; if(!plan) continue;
      const v=[]; for(let i=0;i<CM_DAYS;i++){ const d=addDays(from,i), a=ariGet(prop,g.gid,d); v.push(`${cmChRate(cmBase(prop,g,d),ch).toFixed(2)}|${a.stop?1:0}|${Math.max(1,+a.minStay||1)}`); }
      rates[plan]={from,v,gid:g.gid,ch}; } }
  return {avail,rates};
}
function diffRanges(prev,want,full){
  const out=[]; let cur=null;
  for(let i=0;i<want.v.length;i++){
    const d=addDays(want.from,i), val=want.v[i];
    let pv; if(prev&&prev.v){ const j=d2n(d)-d2n(prev.from); pv=j>=0&&j<prev.v.length?prev.v[j]:undefined; }
    if(full||pv!==val){ if(cur&&cur.val===val&&cur.to===addDays(d,-1)) cur.to=d; else { cur={from:d,to:d,val}; out.push(cur); } }
    else cur=null;
  }
  return out;
}
const cmConn = () => CM.mcp && CM.conn==="ok";
function cmReady(prop){ const c=CM.cfg[prop]; return cmConn()&&S.canWrite&&c&&c.enabled&&c.property_id; }
async function cmCall(tool,input){
  const r=await CM.mcp.callTool(CM_SERVER,tool,input||{},{cache:false});
  return r.payload!==undefined?r.payload:r;
}
function cmErrText(e){
  const c=e&&e.code;
  if(c==="server_not_connected") return `Add the “${CM_SERVER}” connector in claude.ai Settings → Connectors.`;
  if(c==="needs_reauth") return `Reconnect “${CM_SERVER}” in claude.ai Settings → Connectors.`;
  if(c==="not_in_manifest") return "The channel manager connector is turned off for this page. Allow it in the page's Permissions menu.";
  if(c==="selection_required") return `You have more than one connector named “${CM_SERVER}”. Pick one when claude.ai asks.`;
  if(c==="tool_error") return "Channex said: "+(e.message||"error");
  return (e&&e.message)||"Couldn't reach the connector.";
}
async function cmLog(prop,kind,msg){
  if(!S.db) return;

  try{ const s=await ref.get(); const entries=(s.exists&&s.data().entries||[]).concat([{at:nowIso(),kind,msg}]).slice(-200);
    await ref.set({prop,date:S.today,entries}); }catch(e){ console.error(e); }

/* boot + connection */
async function cmBoot(){
  if(CM.started||!S.db) return; CM.started=true;
  S.db.collection("cmconfig").onSnapshot(s=>{ CM.cfg={}; s.docs.forEach(d=>CM.cfg[d.id]=d.data()); cmSchedule(); if(S.view==="channels") render(); },onErr);
  S.db.collection("ari").where("month",">=",S.today.slice(0,7)).onSnapshot(s=>{ CM.ari={}; s.docs.forEach(d=>CM.ari[d.id]=d.data()); cmSchedule(); if(S.view==="channels") render(); },onErr);
  S.db.collection("cmlog").where("date",">=",addDays(S.today,-7)).onSnapshot(s=>{ CM.logs=s.docs.map(d=>d.data()); if(S.view==="channels") render(); },onErr);
  CM.mcp=await window.claude.use("mcp").catch(()=>null);
  if(!CM.mcp){ CM.conn="off"; if(S.view==="channels") render(); return; }
  await cmCheck();
  setInterval(()=>{ if(document.visibilityState==="visible") cmImport(false); },60000);
  setInterval(()=>{ if(document.visibilityState==="visible") cmSyncAll(false); },10*60000);

async function cmCheck(){
  if(!CM.mcp) return;
  CM.conn="checking"; if(S.view==="channels") render();
  const lt=await CM.mcp.listTools().catch(()=>null);
  if(!lt||!(lt.servers||[]).some(x=>x.server===CM_SERVER)){ CM.conn="off"; if(S.view==="channels") render(); return; }
  try{ CM.status=await cmCall("get_status"); CM.conn="ok"; CM.connMsg=""; cmSchedule(); }
  catch(e){ CM.conn="error"; CM.connMsg=cmErrText(e); }
  if(S.view==="channels") render();
}
function cmSchedule(){ if(!CM_ON) return; clearTimeout(CM.schedT); CM.schedT=setTimeout(()=>cmSyncAll(false),8000); }
async function cmSyncAll(full){ for(const prop of Object.keys(CM.cfg)) await cmSync(prop,full); }

/* push availability + rates */
async function cmSync(prop,full){
  if(!cmReady(prop)) return;
  if(CM.syncing){ CM.again=true; return; }
  CM.syncing=true; let pushed=0;
  try{
    const lock=await S.db.doc("cmlock/sync-"+prop).acquire({holder:CM.holder,ttlMs:60000});
    if(!lock.acquired) return;
    const cfg=CM.cfg[prop], stRef=S.db.doc("cmstate/"+prop), st=await stRef.get(), prev=st.exists?st.data():{};
    const want=cmDesired(prop), av=[], rt=[];
    for(const [gid,w] of Object.entries(want.avail)){ const rtId=cfg.groups[gid].room_type_id;
      for(const r of diffRanges((prev.avail||{})[gid],w,full)) av.push({property_id:cfg.property_id,room_type_id:rtId,date_from:r.from,date_to:r.to,availability:+r.val}); }
    for(const [plan,w] of Object.entries(want.rates)){
      for(const r of diffRanges((prev.rates||{})[plan],w,full)){ const [rate,stop,min]=r.val.split("|");
        rt.push({property_id:cfg.property_id,rate_plan_id:plan,date_from:r.from,date_to:r.to,rate:+rate,stop_sell:stop==="1",min_stay_arrival:+min}); } }
    for(let i=0;i<av.length;i+=800){ await cmCall("update_availability",{values:av.slice(i,i+800)}); }
    for(let i=0;i<rt.length;i+=800){ await cmCall("update_rates",{values:rt.slice(i,i+800)}); }
    pushed=av.length+rt.length;
    if(pushed||prev.avail&&Object.values(prev.avail)[0]&&Object.values(prev.avail)[0].from!==S.today||!st.exists)
      await stRef.set({avail:want.avail,rates:Object.fromEntries(Object.entries(want.rates).map(([k,v])=>[k,{from:v.from,v:v.v}])),lastSyncAt:nowIso(),lastSyncBy:S.uid||null});
    if(pushed) await cmLog(prop,"out",`Sent ${av.length} availability and ${rt.length} price/restriction update${pushed===1?"":"s"} to the booking sites${full?" (full resync)":""}.`);
    CM.lastSync=nowIso();
  }catch(e){ console.error(e); await cmLog(prop,"error","Sync failed: "+cmErrText(e)); if(e&&e.code&&e.code!=="tool_error"){ CM.conn="error"; CM.connMsg=cmErrText(e); } }
  finally{ CM.syncing=false; if(S.view==="channels") render(); if(CM.again){ CM.again=false; cmSchedule(); } }
  return pushed;
}

/* import OTA bookings */
function cmChannel(name){ const n=String(name||"").toLowerCase().replace(/[^a-z]/g,"");
  if(n.includes("booking")) return "booking"; if(n.includes("agoda")) return "agoda"; if(n.includes("hostelworld")) return "hostelworld"; if(n.includes("airbnb")) return "airbnb";
  return n||"ota"; }
function cmPickUnit(g,ci,co,keepId,exceptId){
  if(keepId&&g.units.some(u=>u.id===keepId)&&!conflictsFor(keepId,ci,co,exceptId).length) return {unit:unitById(keepId),over:false};
  const free=g.units.find(u=>!conflictsFor(u.id,ci,co,exceptId).length);
  return free?{unit:free,over:false}:{unit:g.units[0],over:true};
}
class CmSkip extends Error{}
async function cmApply(r){
  const prop=Object.keys(CM.cfg).find(p=>CM.cfg[p].property_id===r.property_id);
  if(!prop) throw new CmSkip(`No location is linked to Channex property ${r.property_id}.`);
  const cfg=CM.cfg[prop], ch=cmChannel(r.ota_name), chName=chanLabel(ch)+(r.ota_code?` #${r.ota_code}`:"");
  const mine=S.bookings.filter(b=>b.cmBookingId===r.booking_id);
  if(r.status==="cancelled"){
    for(const b of mine.filter(b=>!isCancel(b.status))){
      await patchBooking(b,{status:"cancelled",payments:(b.payments||[]).map(p=>Object.assign({},p,{voided:true})),cancelledAt:nowIso(),voidReason:`Cancelled on ${chanLabel(ch)}`,cmRevisionId:r.revision_id},`Cancelled on ${chName}`);
      b.status="cancelled";
    }
    await cmLog(prop,"in",`Cancellation from ${chName} · ${r.guest||"guest"}${mine.length?"":" (no matching booking in the PMS)"}.`);
    return;
  }
  const groups=cmGroups(prop), done=[];
  for(let i=0;i<(r.rooms||[]).length;i++){
    const rm=r.rooms[i], gid=Object.keys(cfg.groups||{}).find(k=>cfg.groups[k].room_type_id===rm.room_type_id), g=groups.find(x=>x.gid===gid);
    if(!g) throw new CmSkip(`Channex room type ${rm.room_type_id} isn't linked to any room in Mapping.`);
    const ci=rm.checkin||r.arrival, co=rm.checkout||r.departure;
    if(!validDate(ci)||!validDate(co)||co<=ci) throw new CmSkip("The booking has invalid dates.");
    const id=`cm_${r.booking_id}_${i}`, ex=S.bookings.find(b=>b.id===id), n=nightsBetween(ci,co);
    const total=rm.amount!=null?r2(+rm.amount):r2(g.rate*n), rate=r2(total/n);
    const pick=cmPickUnit(g,ci,co,ex&&ex.unitId,id);
    const guests=Math.max(1,(+rm.adults||0)+(+rm.children||0)||1);
    const otaPay=r.payment_collect==="ota"?[{id:"ota_"+i,mk:"ota",method:"Prepaid via OTA",amount:total,note:`Collected by ${chanLabel(ch)}`,date:S.today,at:nowIso(),by:null}]:[];
    const data={guestName:r.guest||"OTA guest",phone:r.phone||"",email:r.email||"",nationality:r.country||"",checkIn:ci,checkOut:co,guests,rate,channel:ch,otaRef:r.ota_code||"",
      notes:r.notes||"",unitId:pick.unit.id,prop,cmBookingId:r.booking_id,cmRevisionId:r.revision_id,cmRoomIndex:i,overbooked:pick.over};
    if(!ex){
      const doc=Object.assign({},data,{status:"confirmed",ref:(r.ota_code||id.slice(-6)).toString().slice(-8).toUpperCase(),groupId:r.rooms.length>1?"G"+r.booking_id.slice(0,8):null,
        charges:[],payments:otaPay,createdAt:nowIso(),createdBy:null,history:[{at:nowIso(),by:null,action:`Imported from ${chName}`}]});
      await S.db.collection("bookings").doc(id).set(doc);
      if(!S.bookings.some(b=>b.id===id)) S.bookings.push(Object.assign({id},doc)); // count it right away for the next room/booking
    } else {
      const payments=(ex.payments||[]).filter(p=>!String(p.id).startsWith("ota_")).concat(otaPay.length?otaPay:(ex.payments||[]).filter(p=>String(p.id).startsWith("ota_")));
      const patch=Object.assign({},data,{payments});
      if(isCancel(ex.status)) Object.assign(patch,{status:"confirmed"});
      await patchBooking(ex,patch,`Changed on ${chName}`);
      Object.assign(ex,patch);
    }
    done.push(`${pick.unit?unitLabel(pick.unit):"?"}${pick.over?" (OVERBOOKED)":""}`);
  }
  for(const b of mine.filter(b=>(b.cmRoomIndex||0)>=(r.rooms||[]).length&&!isCancel(b.status)))
    await patchBooking(b,{status:"cancelled",payments:(b.payments||[]).map(p=>Object.assign({},p,{voided:true})),voidReason:`Room removed on ${chanLabel(ch)}`},`Room removed on ${chName}`);
  const over=done.some(x=>/OVERBOOKED/.test(x));
  await cmLog(prop,over?"error":"in",`${r.status==="modified"?"Change":"New booking"} from ${chName} · ${r.guest||"guest"} · ${fd(r.arrival)}–${fd(r.departure)} · ${done.join(", ")}${over?" — no free room/bed, move it on the Calendar":""}.`);
}
async function cmImport(manual){
  if(!cmConn()||!S.canWrite||CM.importing) return;
  CM.importing=true; let n=0;
  try{
    const lock=await S.db.doc("cmlock/import").acquire({holder:CM.holder,ttlMs:45000});
    if(!lock.acquired){ if(manual) toast("Another device is importing right now. Try again in a minute."); return; }
    if(manual) await cmCall("sync_now");
    const res=await cmCall("get_new_bookings");
    const list=((res&&res.bookings)||[]).slice().sort((a,b)=>String(a.inserted_at||a.received_at).localeCompare(String(b.inserted_at||b.received_at)));
    const done=[];
    for(const r of list){
      try{ await cmApply(r); done.push(r.revision_id); n++; }
      catch(e){ const prop=Object.keys(CM.cfg).find(p=>CM.cfg[p].property_id===r.property_id)||S.prop;
        await cmLog(prop,"error",`Couldn't import ${r.ota_name||"OTA"} booking ${r.ota_code||r.booking_id}: ${e.message}${e instanceof CmSkip?" It was skipped; add it by hand.":" Will retry."}`);
        if(e instanceof CmSkip) done.push(r.revision_id); }
    }
    if(done.length) await cmCall("mark_bookings_imported",{revision_ids:done});
    if(manual) toast(n?`Imported ${n} OTA update${n===1?"":"s"}`:"No new OTA bookings");
    if(CM.conn!=="ok"){ CM.conn="ok"; CM.connMsg=""; }
  }catch(e){ console.error(e); CM.conn="error"; CM.connMsg=cmErrText(e); if(manual) toast(cmErrText(e)); }
  finally{ CM.importing=false; if(S.view==="channels") render(); }
}
